[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalguard"
version = "0.1.0"
description = "Typed, privacy-preserving provenance graph foundation for agentic AI systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3,<4",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
agentdojo = [
    "agentdojo==0.1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
